description.Spanish=Una de tus amigas sufrió un ataque por parte de un desconocido y sospechas que en realidad estaba dirigido a ti. Decidida a investigar lo que ha pasado, examinas el lugar del suceso con la esperanza de encontrar pistas que te ayuden a encontrar al culpable. \n \n ----------------------------\nEste escenario forma parte del proyecto «Historias de Arkham» y ha sido diseñado para jugarse en solitario con la investigadora Rita Young. Por lo tanto, se debe seleccionar obligatoriamente a Rita Young.\n(v1.25)\n --------------------------\n Tamaño máximo del tablero: 2 x 2.5 módulos cuadrados.\nEste escenario sólo usa componentes del juego base.
description.Polish=Twoja przyjaciółka została napadnięta przez nieznajomego i podejrzewasz, że atak był wymierzony w ciebie. \nBadasz miejsce zdarzenia w nadziei na odnalezienie sprawcy.\n \n ----------------------------\nScenariusz zrealizowano w ramach projektu «Opowieści z Arkham». Jest on przeznaczony wyłącznie do gry w pojedynkę badaczką Ritą Young.\n --------------------------\n Maksymalny rozmiar planszy to 2x2.5 kafelka kwadratowego.\nDo rozgrywki wymagana jest podstawowa wersja scenariusza Posiadłość Szaleństwa.
description.French=Une de vos amies a été attaquée par un inconnu et vous soupçonnez que l'attaque vous était en réalité destinée. Décidée à enquêter sur ce qui s'est passé, vous examinez les lieux du drame dans l'espoir de trouver des indices qui vous aideront à retrouver le coupable. \n \n ----------------------------\nCe scénario fait partie du projet « Histoires d'Arkham » et a été conçu pour être joué en solo avec l'investigatrice Rita Young. Par conséquent, Rita Young doit obligatoirement être sélectionnée.\n --------------------------\n Taille maximale du plateau : 2 x 2,5 tuiles carrées.\nCe scénario utilise uniquement les composants de la boîte de base.
